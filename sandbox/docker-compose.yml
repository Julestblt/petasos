services:
  llm-local:
    image: ollama/ollama:latest
    container_name: petasos-llm-local
    ports:
      - "11434:11434"
    volumes:
      - ./sandbox-data/ollama:/root/.ollama
    networks:
      - petasos-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: petasos-hermes
    depends_on:
      llm-local:
        condition: service_healthy
    ports:
      - "8642:8642"
      - "9119:9119"
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: petasos-local-dev-token
      API_SERVER_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,tauri://localhost,http://tauri.localhost"
      OPENAI_BASE_URL: http://llm-local:11434/v1
      OPENAI_API_KEY: ollama
      MODEL_NAME: qwen2.5-coder:1.5b
    volumes:
      - ./sandbox-data/hermes:/opt/data
    networks:
      - petasos-net
    restart: unless-stopped

networks:
  petasos-net:
    driver: bridge
