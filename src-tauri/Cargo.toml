[package]
name = "petasos"
version = "0.1.0"
description = "Mission Control for Hermes Agent"
authors = ["Petasos"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "petasos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dotenvy = "0.15"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
